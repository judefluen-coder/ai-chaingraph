name: Feature request
description: Suggest a product or UX improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        AI-ChainGraph is an information organization and research aid. Feature requests should preserve the non-advisory boundary: no buy/sell signals, price predictions, or implied investment recommendations.
  - type: textarea
    id: user_need
    attributes:
      label: User need
      description: What would this help an investor or researcher understand?
      placeholder: "Example: I want to compare which AI supply-chain segments have the most L1 evidence."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the UI, workflow, or behavior.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Navigation and layout
        - Company mapping list
        - Graph visualization
        - Detail and evidence panel
        - Search and filters
        - Local review workflow
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention simpler approaches or tradeoffs.
