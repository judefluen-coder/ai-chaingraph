name: Weekly data quality gate

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-weekly-refresh:
    name: Verify weekly graph refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test weekly relationship pipeline
        run: npm test

      - name: Validate public snapshot
        run: npm run validate:snapshot

      - name: Enforce relationship depth, listing coverage, and weekly freshness
        run: npm run audit:relationships -- --min-specific-issuer-rate=0.9 --max-check-age-days=8 --max-a-share-listing-reconciliation-age-days=8

      - name: Build frontend
        run: npm run build
