name: Weekly data quality gate

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-weekly-refresh:
    name: Verify weekly graph refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for UI smoke test
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify weekly graph and both release targets
        run: npm run build:sites
