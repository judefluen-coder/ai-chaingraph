name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-build:
    name: Smoke test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate demo data and boundaries
        run: npm run smoke

      - name: Validate public import example
        run: npm run validate:example

      - name: Validate tabular import examples
        run: npm run validate:tabular

      - name: Validate public snapshot release boundary
        run: npm run validate:publication

      - name: Build frontend
        run: npm run build
