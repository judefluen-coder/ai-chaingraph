name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate v1.1 snapshot and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test weekly relationship pipeline
        run: npm test

      - name: Validate public transmission snapshot
        run: npm run validate:snapshot

      - name: Enforce relationship depth, listing coverage, and weekly freshness
        run: npm run audit:relationships -- --min-specific-issuer-rate=0.9 --max-check-age-days=8 --max-a-share-listing-reconciliation-age-days=8

      - name: Block new usage-only physical integration mappings
        run: npm run audit:semantic-precision

      - name: Check graph search performance
        run: npm run check:performance

      - name: Install Chromium for UI smoke test
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test desktop and mobile research paths
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build
